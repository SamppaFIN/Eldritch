name: Rebuild world.json

# BRDC-SHARE-001 / -002. Multiplayer without a server: players submit their territory as a
# `world:`-titled issue, this job keeps one file per player under apps/game/public/world/
# players/, merges the un-stale ones into world/<res6>.json, pushes, and kicks deploy.yml
# (a GITHUB_TOKEN push does not trip `on: push`, so it is triggered by hand here).
#
# Runs only on the default branch. Match is on the title prefix, not the label: a friend
# without triage rights cannot apply a label from the issue-new URL, but anyone can set a
# title.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: world
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # build-world.mjs imports packages/core/dist; `pnpm typecheck` is `tsc -b`, which emits it.
      - run: pnpm typecheck

      - name: Collect submissions, oldest first
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state open --limit 500 --json number,body,title,createdAt \
            | jq '[.[] | select(.title | startswith("world:")) | {number, body, createdAt}]
                  | sort_by(.number)' > issues.json
          jq -r '.[].number' issues.json > processed.txt
          echo "matched $(jq length issues.json) issue(s)"

      - run: node scripts/build-world.mjs < issues.json

      - name: Commit the rebuilt world
        id: commit
        run: |
          git config user.name 'eldritch-world-bot'
          git config user.email 'world-bot@users.noreply.github.com'
          git add apps/game/public/world
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m 'world.json: scheduled rebuild'
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy the new world to Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: Close merged submissions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r n; do
            [ -n "$n" ] && gh issue close "$n" --comment 'Merged into world.json.'
          done < processed.txt
